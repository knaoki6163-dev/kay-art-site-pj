<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Analytics 4（共通ファイルで全ページ統一） -->
  <script src="js/analytics.js?v=19"></script>

  <title>A. Kato — 絵画作品集 / Paintings Portfolio</title>
  <meta name="description" content="心の奥にある風景を、絵にしています。アクリル絵の具を中心に描く A. Kato の絵画ポートフォリオ。自然・日常・コンセプトアートをテーマにした作品をご覧いただけます。" />
  <link rel="canonical" href="__SITE_URL__/" />

  <!-- Open Graph / Twitter -->
  <meta property="og:title" content="A. Kato — 絵画作品集" />
  <meta property="og:description" content="心の奥にある風景を、絵にしています。A. Kato の絵画ポートフォリオ。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:image" content="__SITE_URL__/favicon.png" />
  <meta property="og:site_name" content="A. Kato" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="A. Kato — 絵画作品集" />
  <meta name="twitter:description" content="心の奥にある風景を、絵にしています。" />
  <meta name="twitter:image" content="__SITE_URL__/favicon.png" />

  <!-- 構造化データ（検索エンジン向け） -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "A. Kato",
    "url": "__SITE_URL__/",
    "inLanguage": "ja",
    "about": { "@type": "Person", "@id": "__SITE_URL__/#artist" }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "__SITE_URL__/#artist",
    "name": "A. Kato",
    "url": "__SITE_URL__/",
    "jobTitle": "画家 / Painter",
    "description": "自然や日常の中で感じた静かな感情や風景を、アクリル絵の具を中心に描くアーティスト。"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Shippori+Mincho:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css?v=19" />
  <noscript><style>.hero { opacity: 1 !important; }</style></noscript>
  <script>
    // 他ページのHomeリンクをクリックした直後だけ遷移を逆再生（それまでのページが
    // 右へ退き、Home が左から現れる）にする。main.js のクリックリスナーが
    // sessionStorage にフラグを立てる。<main> のCSSアニメーションは描画開始と
    // 同時に評価されるため、body/main が作られる前（head内）で同期的に判定する。
    (function () {
      try {
        if (sessionStorage.getItem("vtToHome")) {
          document.documentElement.classList.add("vt-to-home");
          sessionStorage.removeItem("vtToHome");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- 紙テクスチャ背景 -->
  <div class="paper-grain" aria-hidden="true"></div>

  <!-- ヘッダー -->
  <header class="site-header is-over-hero" id="top">
    <a class="brand" href="/">
      <span class="brand__name" data-content="siteName">A. Kato</span>
    </a>
    <div class="header-right">
      <nav class="nav" aria-label="メインナビゲーション">
        <a href="/">Home</a>
        <a href="/works.html">Works</a>
        <a href="/info.html">Info</a>
        <a href="/blog.html">Blog</a>
        <a href="/artist.html">Artist</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <div class="lang-switch">
        <select id="lang-select" aria-label="Language / 言語">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </div>
      <button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ヒーロー -->
  <section class="hero" id="hero">
    <div class="hero__carousel" id="hero-carousel" aria-hidden="true"></div>
    <div class="hero__scrim" aria-hidden="true"></div>
    <div class="hero__content">
      <h1 class="hero__title" data-content="heroTitle">静けさの中の、<br />かすかな光。</h1>
      <p class="hero__lead" data-content="heroLead">心の奥にある風景を、<br />絵にしています。</p>
      <a class="link-arrow link-arrow--light" href="/works.html" data-content="heroButton">VIEW WORKS</a>
    </div>
    <div class="hero__dots" id="hero-dots" role="tablist" aria-label="スライド切り替え"></div>

    <!-- 筆で擦ったような境界（下） -->
    <div class="edge edge--bottom" aria-hidden="true">
      <svg viewBox="0 0 1440 70" preserveAspectRatio="none">
        <defs>
          <filter id="brush-a" x="-3%" y="-90%" width="106%" height="280%">
            <feTurbulence type="fractalNoise" baseFrequency="0.009 0.11" numOctaves="3" seed="4" stitchTiles="stitch" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="30" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <path filter="url(#brush-a)" d="M-30,40 C 200,31 380,47 560,37 C 740,29 920,45 1100,35 C 1280,29 1410,42 1470,37 L1470,200 L-30,200 Z" fill="#f3efe6"/>
      </svg>
    </div>
  </section>

  <main>
    <!-- Works（トップではプレビュー。全件は専用ページへ） -->
    <div class="feature">
      <section class="works" id="works">
        <div class="block-head">
          <h2 class="script-h">Works</h2>
          <a class="view-all" href="/works.html">VIEW ALL <span aria-hidden="true">&rarr;</span></a>
        </div>
        <div class="works-grid" id="gallery" data-preview="8" data-featured="1" aria-live="polite"></div>
      </section>
    </div>

    <!-- Info（お知らせ。全件は専用ページへ） -->
    <div class="feature">
      <section class="news" id="info">
        <div class="block-head">
          <h2 class="script-h">Info</h2>
          <a class="view-all" href="/info.html">VIEW ALL <span aria-hidden="true">&rarr;</span></a>
        </div>
        <ul class="news-list" id="news-list"></ul>
        <p class="news-empty" id="news-empty" hidden>お知らせはまだありません。</p>
      </section>
    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-base">
      <div class="footer-social">
        <a href="#" data-content-href="instagramUrl" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
      <p class="copyright">© <span id="year"></span> <span data-content="siteName">A. Kato</span>. <span data-content="copyrightSuffix">All Rights Reserved.</span></p>
    </div>
  </footer>

  <!-- ライトボックス -->
  <div class="lightbox" id="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="作品ビューア">
    <button class="lightbox__close" aria-label="閉じる">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="前の作品">&#8249;</button>
    <figure class="lightbox__figure">
      <img class="lightbox__image" id="lightbox-image" alt="" />
      <figcaption class="lightbox__caption">
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-meta"></p>
      </figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" aria-label="次の作品">&#8250;</button>
  </div>

  <script src="js/main.js?v=19"></script>
</body>
</html>
