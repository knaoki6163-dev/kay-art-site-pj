  <script>
    // 他のサブページ（Works/Info/Blog/Artist/Contact）からのリンクをクリックした
    // 直後だけ、PC版の横スライド演出を有効にする。main.js のクリックリスナーが
    // sessionStorage にフラグを立てる。<main> のCSSアニメーションは描画開始と
    // 同時に評価されるため、body/main が作られる前（head内）で同期的に判定する。
    (function () {
      try {
        if (sessionStorage.getItem("vtSubpage")) {
          document.documentElement.classList.add("vt-subpage");
          sessionStorage.removeItem("vtSubpage");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="subpage">
  <div class="paper-grain" aria-hidden="true"></div>

  <header class="site-header" id="top">
    <a class="brand" href="/"><span class="brand__name" data-content="siteName">A. Kato</span></a>
    <div class="header-right">
      <nav class="nav" aria-label="メインナビゲーション">
        <a href="/">Home</a>
        <a href="/works.html">Works</a>
        <a href="/info.html">Info</a>
        <a href="/blog.html">Blog</a>
        <a href="/artist.html">Artist</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <div class="lang-switch">
        <select id="lang-select" aria-label="Language / 言語">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </div>
      <button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="page-wrap">
    <!-- About（深緑） -->
    <section class="about" id="about">
      <div class="edge edge--top" aria-hidden="true">
        <svg viewBox="0 0 1440 70" preserveAspectRatio="none">
          <defs>
            <filter id="brush-b" x="-3%" y="-90%" width="106%" height="280%">
              <feTurbulence type="fractalNoise" baseFrequency="0.008 0.1" numOctaves="3" seed="11" stitchTiles="stitch" result="t"/>
              <feDisplacementMap in="SourceGraphic" in2="t" scale="30" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
          <path filter="url(#brush-b)" d="M-30,40 C 220,30 400,46 580,36 C 760,28 940,44 1120,34 C 1300,28 1420,42 1470,37 L1470,200 L-30,200 Z" fill="#434d3c"/>
        </svg>
      </div>

      <div class="about__inner">
        <div class="about__text">
          <h2 class="script-h script-h--light">About</h2>
          <p data-content="aboutBody">自然や日常の中で感じた、静かな感情や風景を描いています。アクリル絵の具を中心に、重ねることで生まれる質感や、色の奥行きを大切にしています。</p>
        </div>
        <div class="about__art" aria-hidden="true">
          <span class="signature" data-content="aboutSignature">A. Kato</span>
        </div>
      </div>

      <div class="edge edge--bottom" aria-hidden="true">
        <svg viewBox="0 0 1440 70" preserveAspectRatio="none">
          <defs>
            <filter id="brush-c" x="-3%" y="-90%" width="106%" height="280%">
              <feTurbulence type="fractalNoise" baseFrequency="0.0085 0.12" numOctaves="3" seed="19" stitchTiles="stitch" result="t"/>
              <feDisplacementMap in="SourceGraphic" in2="t" scale="30" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
          <path filter="url(#brush-c)" d="M-30,38 C 210,30 390,45 570,35 C 760,27 940,43 1120,34 C 1300,28 1410,40 1470,36 L1470,200 L-30,200 Z" fill="#f3efe6"/>
        </svg>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-base">
      <div class="footer-social">
        <a href="#" data-content-href="instagramUrl" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
      <p class="copyright">© <span id="year"></span> <span data-content="siteName">A. Kato</span>. <span data-content="copyrightSuffix">All Rights Reserved.</span></p>
    </div>
  </footer>

  <script src="js/main.js?v=28"></script>
