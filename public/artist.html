    <section class="about" id="about">
      <div class="edge edge--top" aria-hidden="true">
        <svg viewBox="0 0 1440 70" preserveAspectRatio="none">
          <defs>
            <filter id="brush-b" x="-3%" y="-90%" width="106%" height="280%">
              <feTurbulence type="fractalNoise" baseFrequency="0.008 0.1" numOctaves="3" seed="11" stitchTiles="stitch" result="t"/>

      <div class="about__inner">
        <div class="about__text">
          <h2 class="script-h script-h--light">About</h2>
          <p data-content="aboutBody">自然や日常の中で感じた、静かな感情や風景を描いています。アクリル絵の具を中心に、重ねることで生まれる質感や、色の奥行きを大切にしています。</p>
          <a class="link-arrow link-arrow--light" href="/contact.html" data-content="aboutButton">MORE ABOUT</a>
        </div>
        <div class="about__art" aria-hidden="true">
          <svg class="about__paint" viewBox="0 0 440 240" preserveAspectRatio="xMidYMid meet">
            <defs>
              <filter id="paint-brush" x="-25%" y="-60%" width="150%" height="220%">
                <feTurbulence type="fractalNoise" baseFrequency="0.013 0.16" numOctaves="2" seed="6" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="20" xChannelSelector="R" yChannelSelector="G"/>
              </filter>
              <filter id="paint-soft" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="5"/>
              </filter>
            </defs>
            <rect filter="url(#paint-brush)" x="26" y="94" width="196" height="72" rx="6" fill="#586f88" />
            <rect filter="url(#paint-brush)" x="42" y="104" width="150" height="30" rx="4" fill="#7e98ad" opacity="0.55" />
            <rect filter="url(#paint-soft)" x="292" y="56" width="54" height="54" fill="#989c92" opacity="0.85" />
            <ellipse filter="url(#paint-soft)" cx="340" cy="150" rx="80" ry="50" fill="#d8927a" opacity="0.92" />

          <span class="signature" data-content="aboutSignature">A. Kato</span>
