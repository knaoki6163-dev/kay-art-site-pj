<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/analytics.js?v=19"></script>
  <title>Works — A. Kato</title>
  <meta name="description" content="A. Kato の絵画作品一覧。自然・日常・コンセプトアートをテーマにしたアクリル画をご覧いただけます。" />
  <link rel="canonical" href="__SITE_URL__/works.html" />
  <meta property="og:title" content="Works — A. Kato" />
  <meta property="og:description" content="A. Kato の絵画作品一覧。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="__SITE_URL__/works.html" />
  <meta property="og:image" content="__SITE_URL__/favicon.png" />
  <meta property="og:site_name" content="A. Kato" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Shippori+Mincho:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css?v=19" />
  <script>
    // 他のサブページ（Works/Info/Blog/Artist/Contact）からのリンクをクリックした
    // 直後だけ、PC版の横スライド演出を有効にする。main.js のクリックリスナーが
    // sessionStorage にフラグを立てる。<main> のCSSアニメーションは描画開始と
    // 同時に評価されるため、body/main が作られる前（head内）で同期的に判定する。
    (function () {
      try {
        if (sessionStorage.getItem("vtSubpage")) {
          document.documentElement.classList.add("vt-subpage");
          sessionStorage.removeItem("vtSubpage");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="subpage page-works">
  <div class="paper-grain" aria-hidden="true"></div>

  <header class="site-header" id="top">
    <a class="brand" href="/"><span class="brand__name" data-content="siteName">A. Kato</span></a>
    <div class="header-right">
      <nav class="nav" aria-label="メインナビゲーション">
        <a href="/">Home</a>
        <a href="/works.html">Works</a>
        <a href="/info.html">Info</a>
        <a href="/blog.html">Blog</a>
        <a href="/artist.html">Artist</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <div class="lang-switch">
        <select id="lang-select" aria-label="Language / 言語">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </div>
      <button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="page-wrap">
    <div class="feature">
      <section class="works" id="works">
        <div class="block-head">
          <h2 class="script-h">Works</h2>
        </div>
        <div class="filters" role="tablist" aria-label="カテゴリで絞り込み"></div>
        <div class="works-grid" id="gallery" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-base">
      <div class="footer-social">
        <a href="#" data-content-href="instagramUrl" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
      <p class="copyright">© <span id="year"></span> <span data-content="siteName">A. Kato</span>. <span data-content="copyrightSuffix">All Rights Reserved.</span></p>
    </div>
  </footer>

  <!-- ライトボックス -->
  <div class="lightbox" id="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="作品ビューア">
    <button class="lightbox__close" aria-label="閉じる">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="前の作品">&#8249;</button>
    <figure class="lightbox__figure">
      <img class="lightbox__image" id="lightbox-image" alt="" />
      <figcaption class="lightbox__caption">
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-meta"></p>
      </figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" aria-label="次の作品">&#8250;</button>
  </div>

  <script src="js/main.js?v=19"></script>
</body>
</html>
