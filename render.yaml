# =========================================================
# Render デプロイ設定（Blueprint）
# https://render.com/docs/blueprint-spec
#
# ・Starterプラン + 永続ディスクの構成です。
#   アップロード画像・お問い合わせ・編集した文章は /var/data に保存され、
#   再デプロイ・再起動しても消えません。
# ・無料(free)に戻したい場合は plan を free にし、disk と
#   DATA_DIR / UPLOAD_DIR の3項目を削除（コメントアウト）してください。
# =========================================================
services:
  - type: web
    name: aquarelle-portfolio
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # 管理画面のパスワード。Renderのダッシュボードで値を入力してください（公開されません）。
      - key: ADMIN_PASSWORD
        sync: false
      # セッション用の秘密鍵は自動生成させます。
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      # データの保存先を永続ディスク上に指定（これで再デプロイしても消えない）
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # アクセス解析（GA4 Data API）。未設定でもサーバーは動きます
      # （管理画面のアクセス解析タブが「未設定」表示になるだけ）。
      # 設定方法は DEPLOY.md を参照してください。
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GA4_SERVICE_ACCOUNT_JSON
        sync: false

    # 永続ディスク（作品画像・お問い合わせ・文章の保存先）
    disk:
      name: aquarelle-data
      mountPath: /var/data
      sizeGB: 1
